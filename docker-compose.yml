# PostgreSQL local pour le développement.
# Démarrer : `docker compose up -d`
# DATABASE_URL : postgresql://atlas:atlas@localhost:5432/atlas?schema=public
services:
  db:
    image: postgres:16-alpine
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atlas_pgdata:
